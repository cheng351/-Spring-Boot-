services:
  postgres:
    image: postgres:16
    container_name: hapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect

  smart-launcher:
    build:
      context: ./smart-auth/smart-launcher-custom
      dockerfile: Dockerfile
    image: mindstep-smart-launcher-custom
    container_name: mindstep-smart-launcher
    restart: unless-stopped
    depends_on:
      - hapi-fhir
    ports:
      - "8090:80"
    environment:
      FHIR_SERVER_R4: "http://host.docker.internal:8080/fhir"

  mindstep-ehr:
    build:
      context: ./smart-auth/SMART-EHR-Launcher
      dockerfile: Dockerfile
    image: mindstep-ehr-launcher
    container_name: mindstep-ehr
    restart: unless-stopped
    depends_on:
      - smart-launcher
    ports:
      - "8082:80"

volumes:
  hapi-postgres-data: